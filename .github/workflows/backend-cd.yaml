name: Backend Continuous Deployment

on:
  push:
    branches: [main]
    paths:
      - 'starter/backend/**'
      - '.github/workflows/backend-cd.yaml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: starter/backend

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: cluster
  ECR_REPOSITORY: backend
  KUBECTL_VERSION: v1.35.0
  PYTHON_VERSION: '3.10'
  PIPENV_VERSION: '2026.6.2'
  # uWSGI 2.0.21 does not compile with the C23 default of newer GCC on the runner,
  # so build it with the previous C standard (same fix as starter/backend/Dockerfile).
  CFLAGS: -std=gnu17

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python (pipenv cache)
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pipenv
          cache-dependency-path: starter/backend/Pipfile.lock

      - name: Install pipenv
        run: python -m pip install "pipenv==${PIPENV_VERSION}"

      - name: Install dependencies from Pipfile.lock
        run: pipenv install --dev --deploy

      - name: Run linter (flake8)
        run: pipenv run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python (pipenv cache)
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pipenv
          cache-dependency-path: starter/backend/Pipfile.lock

      - name: Install pipenv
        run: python -m pip install "pipenv==${PIPENV_VERSION}"

      - name: Install dependencies from Pipfile.lock
        run: pipenv install --dev --deploy

      - name: Run tests (pytest)
        run: pipenv run test

  build:
    name: Build and push image to ECR
    # Runs only after lint and test succeed, and only for main (manual runs included).
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pre-pull the Dockerfile base image
        # public.ecr.aws rate-limits anonymous pulls from shared runner IPs (HTTP 429).
        # Its docker/library images mirror Docker Hub's official images, so fall back to
        # the same image on Docker Hub and tag it with the name the Dockerfile uses.
        run: |
          BASE=$(awk 'toupper($1)=="FROM" {print $2; exit}' Dockerfile)
          SRC="docker.io/library/${BASE#public.ecr.aws/docker/library/}"
          docker pull "$BASE" || { docker pull "$SRC" && docker tag "$SRC" "$BASE"; }

      - name: Build the Docker image tagged with the commit SHA
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: docker build --tag "$IMAGE" .

      - name: Push the image to ECR
        id: push
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Pushed \`$IMAGE\` ($(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" | cut -d@ -f2))" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to EKS
    # Runs only after the image for this commit was built and pushed.
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # One backend rollout at a time. A newer run waits instead of cancelling a rollout.
    concurrency:
      group: backend-deploy
      cancel-in-progress: false
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl for the cluster version
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Update kubeconfig for the EKS cluster
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Deploy the new image with Kustomize and kubectl
        working-directory: starter/backend/k8s
        run: |
          test -n "$IMAGE"
          kustomize version
          # Only this runner's checkout is edited; the image change is never committed.
          kustomize edit set image backend="$IMAGE"
          kustomize build | kubectl apply -f -

      - name: Wait for the rollout to finish
        run: kubectl rollout status deployment/backend --timeout=300s

      - name: Verify the running pods use this commit's image
        run: |
          kubectl get pods -l app=backend --field-selector=status.phase=Running \
            -o jsonpath='{range .items[*]}{.metadata.name}{"  "}{.spec.containers[0].image}{"\n"}{end}' | tee pods.txt
          test "$(kubectl get deployment backend -o jsonpath='{.spec.template.spec.containers[0].image}')" = "$IMAGE"
          grep -qF ":${GITHUB_SHA}" pods.txt

      - name: Smoke test GET /movies through the load balancer
        run: |
          for i in $(seq 1 30); do
            HOST=$(kubectl get service backend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            [ -n "$HOST" ] && break
            sleep 10
          done
          test -n "$HOST"
          URL="http://${HOST}/movies"
          # New load balancers can take a few minutes to resolve, so retry for up to 5 minutes.
          curl --fail --silent --show-error --retry 30 --retry-delay 10 --retry-all-errors --max-time 10 "$URL" -o movies.json
          jq -e '.movies | length > 0' movies.json
          {
            echo "### Backend deployed"
            echo "- Image: \`$IMAGE\`"
            echo "- URL: $URL"
            echo "- Movies: $(jq -r '[.movies[].title] | join(", ")' movies.json)"
          } >> "$GITHUB_STEP_SUMMARY"
